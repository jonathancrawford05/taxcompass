[tool.poetry]
name = "taxcompass-backend"
version = "0.1.0"
description = "AI-Powered Cross-Border Tax Analysis - Backend API"
authors = ["TaxCompass Team"]
license = "AGPL-3.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"

# Agent Framework
langchain = "^0.1.0"
langchain-community = "^0.0.13"
langgraph = "^0.0.20"
langchain-openai = "^0.0.5"

# LLM
openai = "^1.10.0"  # For Azure OpenAI fallback

# Vector Store
qdrant-client = "^1.7.0"

# Database
sqlalchemy = "^2.0.25"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"

# Document Processing
pymupdf = "^1.23.0"
unstructured = {extras = ["pdf"], version = "^0.12.0"}
pillow = "^10.2.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
cryptography = "^42.0.0"

# Payment
stripe = "^8.0.0"

# Utilities
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
aiofiles = "^23.2.1"

# Observability
sentry-sdk = {extras = ["fastapi"], version = "^1.40.0"}

# Rate Limiting
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"

# Code Quality
black = "^24.1.0"
ruff = "^0.2.0"
mypy = "^1.8.0"
isort = "^5.13.0"

# Development
ipython = "^8.20.0"
ipdb = "^0.13.13"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
